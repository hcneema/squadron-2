<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>Squadron 2 — Offline</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #050d1a 0%, #0a1628 40%, #0d2444 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .plane { font-size: 64px; opacity: 0.4; }
    h1 { font-size: 22px; font-weight: 700; }
    p { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6; max-width: 280px; }
    button {
      margin-top: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      cursor: pointer;
    }
    button:active { background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="plane">✈</div>
    <h1>You're Offline</h1>
    <p>The Squadron 2 app server isn't reachable right now. Make sure the server is running and you're on the same network.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
